<style>
  :root { --bg:#0d1117; --ink:#c9d1d9; --muted:#8b949e; --accent:#7ee787; --line:#21262d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; font-size:15px; line-height:1.7; }
  .wrap { max-width:720px; margin:0 auto; padding:48px 20px 64px; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .prompt { color:var(--accent); }
  .cmd { color:var(--ink); font-weight:700; }
  header { margin-bottom:8px; }
  header .who { display:flex; gap:20px; align-items:flex-start; margin:12px 0 4px; }
  h1 { font-size:1.6rem; margin:0 0 8px; line-height:1.3; }
  .nav a { margin-right:4px; }
  section { margin-top:32px; }
  details { margin-top:32px; }
  details details { margin-top:16px; }
  summary { cursor:pointer; padding-bottom:8px; border-bottom:1px solid var(--line); margin-bottom:12px; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:"\25B8  "; color:var(--accent); }
  details[open] > summary::before { content:"\25BE  "; color:var(--accent); }
  details details summary { border-bottom:none; margin-bottom:4px; padding-bottom:0; font-weight:700; }
  details details summary::before { content:"\25B8  "; }
  details details[open] > summary::before { content:"\25BE  "; }
  p { margin:0 0 14px; }
  .note { color:var(--muted); }
  .sub { color:var(--muted); font-weight:700; margin:12px 0 0; }
  ul { list-style:none; padding:0; margin:0 0 14px; }
  li { padding:6px 0; }
  li::before { content:"- "; color:var(--muted); }
  .meta { color:var(--muted); font-size:.85rem; }
  .src { color:var(--muted); font-size:.8rem; border:1px solid var(--line); border-radius:3px; padding:0 4px; margin-left:4px; white-space:nowrap; }
  footer { margin-top:48px; color:var(--muted); font-size:.9rem; border-top:1px solid var(--line); padding-top:16px; }
  .cursor { display:inline-block; width:9px; height:17px; background:var(--accent); vertical-align:text-bottom; animation:blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
</style>
</head>
<body>
<div class="wrap">

<header>
  <p><span class="prompt">$</span> <span class="cmd">whoami</span></p>
  <div class="who">
    <div>
      <h1>Sushaant Mujoo</h1>
      <p class="nav">
        <a href="https://www.linkedin.com/in/sushaantmujoo">[linkedin]</a>
        <a href="https://github.com/broodingGoat">[github]</a>
        <a href="https://sushaantmujoo.medium.com/">[medium]</a>
        <a href="#" id="email">[email]</a>
      </p>
    </div>
  </div>
</header>

{{ content }}

<footer>
  <p>© 2026 Sushaant Mujoo · San Carlos, CA</p>
  <p><span class="prompt">sushaant@home:~$</span> <span class="cursor"></span></p>
</footer>

</div>
<script>
(function () {
  var u = "sushaant.mujoo", d = "gmail.com", e = u + String.fromCharCode(64) + d;
  var l = document.getElementById("email");
  l.href = "mailto:" + e;
  l.textContent = "[" + e + "]";
})();
</script>
</body>
</html>
